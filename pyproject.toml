[project]
name = "toollife"
version = "0.1.0"
description = "ToolLife Policy: CNC cutter failure prediction and replacement decisions"
requires-python = ">=3.11,<3.14"
dependencies = [
  "numpy>=2.0",
  "pandas>=2.2",
  "pyarrow>=17",
  "openpyxl>=3.1",
  "scipy>=1.13",
  "scikit-learn>=1.5",
  "lightgbm>=4.5",
  "xgboost>=2.1",
  "lifelines>=0.29",
  "matplotlib>=3.9",
  "shap>=0.46",
  "h5py>=3.16.0",
  "gymnasium>=1.4.0",
  "stable-baselines3>=2.9.2",
  "sb3-contrib>=2.9.2",
  "torch>=2.14.1",
  "markdown>=3.11.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/toollife"]
